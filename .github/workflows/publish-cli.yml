name: publish-cli

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run packaging checks without publishing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@allowly"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Inspect package
        run: npm pack --dry-run

      - name: Publish private package
        if: ${{ inputs.dry_run == 'false' }}
        env:
          # Create this as a GitHub Actions secret. It should be an npm
          # automation/access token with publish rights to the @allowly scope.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access restricted
